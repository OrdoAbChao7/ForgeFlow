[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "forgeflow-harness"
version = "2.0.0"
description = "ForgeFlow 2.0 - a durable, verifiable and evaluable AI coding harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ForgeFlow contributors" }]
keywords = ["ai", "coding-agent", "harness", "verification", "durable-execution"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "rich>=13,<15",
  "PyYAML>=6,<7",
  "tree-sitter>=0.24,<0.26",
  "tree-sitter-python>=0.23,<0.26",
  "tree-sitter-typescript>=0.23,<0.26",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "hypothesis>=6.120,<7",
  "ruff>=0.8,<1",
]
docker = ["docker>=7.1,<8"]

[project.scripts]
forge = "forgeflow.cli:app"

[project.urls]
Documentation = "https://github.com/OrdoAbChao7/ForgeFlow/tree/main/docs"
Repository = "https://github.com/OrdoAbChao7/ForgeFlow"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeflow"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: long-running end-to-end or clean-room tests",
  "external: requires a real external service or credential",
]
filterwarnings = ["error::DeprecationWarning:forgeflow.*"]

[tool.coverage.run]
source = ["forgeflow"]
branch = true

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117"]
