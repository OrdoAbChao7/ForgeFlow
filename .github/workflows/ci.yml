name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set Python
        run: uv python install ${{ matrix.python }}
      - name: Sync locked dependencies
        run: uv sync --extra dev --locked
      - name: Lint
        run: uv run ruff check src tests
      - name: Full test suite (unit, integration, e2e, chaos, security)
        run: uv run pytest -q
      - name: Build wheel
        run: uv build --wheel
      - name: CLI help
        run: uv run forge --help
      - name: Doctor JSON
        run: uv run forge doctor --json
      - name: Upload coverage and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.os }}-${{ matrix.python }}
          path: |
            .coverage
            coverage.xml
            dist/*.whl
          if-no-files-found: ignore
